# Cloud Resource Allocation Simulation Configuration
# Infrastructure Parameters
hosts.count=5
hosts.pes=8
hosts.mips=2500
hosts.ram.mb=32768
hosts.bw.mbps=10000
hosts.storage.mb=1000000

# Virtual Machine Parameters
vms.count=20
vms.initial.per.host=4
vms.pes=2
vms.mips=2500
vms.ram.mb=4096
vms.bw.mbps=1000
vms.size.mb=10000

# Simulation Parameters
simulation.duration.seconds=1200
cloudlets.default.count=500
cloudlets.base.length=150000
sla.response.time.threshold=0.5
random.seed=42

# Dynamic Allocation Policy Parameters
dynamic.cpu.upper.threshold=0.80
dynamic.cpu.lower.threshold=0.30
dynamic.monitoring.interval.seconds=10
dynamic.enable.underload.consolidation=false
